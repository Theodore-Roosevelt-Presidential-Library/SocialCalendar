name: Refresh social calendar

on:
  schedule:
    # 6am and 6pm US Central (11:00 / 23:00 UTC). GitHub's scheduler is
    # best-effort and can run several minutes late under load.
    - cron: '0 11,23 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Days of upcoming schedule to pull'
        required: false
        default: '90'
      days_back:
        description: 'Days of published history to keep'
        required: false
        default: '14'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
      # Pushes made with GITHUB_TOKEN do not re-trigger workflows, so the bot's
      # own snapshot commit cannot loop - but excluding the data it writes makes
      # that guarantee independent of that behaviour.
      - '!site/data/**'

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs rotate the Hootsuite refresh token at the same time - the
# token is single-use, and a race would break the chain and force a manual
# re-authorization.
concurrency:
  group: social-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      fetched: ${{ steps.fetch.outputs.fetched }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Check for Hootsuite credentials
        id: creds
        env:
          CID: ${{ secrets.HOOTSUITE_CLIENT_ID }}
          PAT: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -n "$CID" ] && [ -n "$PAT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Hootsuite secrets are not configured yet - deploying \
          the committed snapshot unchanged. See SETUP.md."
          fi

      - name: Pull schedule from Hootsuite
        id: fetch
        if: steps.creds.outputs.ready == 'true'
        env:
          HOOTSUITE_CLIENT_ID: ${{ secrets.HOOTSUITE_CLIENT_ID }}
          HOOTSUITE_CLIENT_SECRET: ${{ secrets.HOOTSUITE_CLIENT_SECRET }}
          HOOTSUITE_REFRESH_TOKEN: ${{ secrets.HOOTSUITE_REFRESH_TOKEN }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '90' }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '14' }}
        run: |
          python scripts/build_calendar.py
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed snapshot
        if: steps.fetch.outputs.fetched == 'true'
        run: |
          git config user.name  "trpl-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Refresh social calendar ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-on-failure:
    needs: [build, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue so the break is visible
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Social calendar refresh is failing';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'calendar-refresh'
            });
            const body = [
              'The scheduled refresh failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Most common cause: the Hootsuite refresh token chain broke.',
              'Fix by re-running `python scripts/bootstrap_auth.py` locally and',
              'updating the `HOOTSUITE_REFRESH_TOKEN` secret. See SETUP.md.'
            ].join('\n');
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['calendar-refresh']
              });
            }
